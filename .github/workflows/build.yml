name: Build FTBUltimine 1.7.10

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore source archive
        shell: bash
        run: |
          cat source/FTBUltimine-port4.b64.part* | base64 --decode > FTBUltimine-port4-sources.zip
          echo "6e01c84cd7f2173575e785b0257206f522ae5a09d456dab66fbf18ade4992f3e  FTBUltimine-port4-sources.zip" | sha256sum --check
          mkdir project
          unzip -q FTBUltimine-port4-sources.zip -d project

      - name: Set up Java 8 and 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            21

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Show build environment
        run: |
          java -version
          gradle --version

      - name: Build mod
        working-directory: project
        run: gradle clean build --no-daemon --stacktrace

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: FTBUltimine-1.7.10-port.4
          path: project/build/libs/*.jar
          if-no-files-found: error
